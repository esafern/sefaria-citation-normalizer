name: tests
# Offline only: no requests to Sefaria from CI. The networked benchmark
# (benchmark.py, pipeline/web_pairs.py eval) is run by hand, gently.
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: citenorm --version
      - run: python test_rules_offline.py
      - run: python test_shared_dialect.py   # skips without a configured twin
      - run: python demo/test_demo_offline.py
      - run: python test_cache_offline.py      # non-UTF-8 locale, stub files, outages
